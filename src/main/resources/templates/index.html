<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des utilisateurs</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">
    <h1>Gestion des utilisateurs</h1>

    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
        <h2>Aucun utilisateur disponible</h2>
    </div>

    <div th:unless="${#lists.isEmpty(users)}">
        <table>
            <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Modifier</th>
                <th>Supprimer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <a class="action-btn edit" th:href="@{/edit/{id}(id=${user.id})}">Modifier</a>
                </td>
                <td>
                    <a class="action-btn delete" th:href="@{/delete/{id}(id=${user.id})}">Supprimer</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a class="add-link" th:href="@{/signup}">+ Ajouter un utilisateur</a>
</div>

</body>
</html>
